[package]
name = "ppr-tool"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Publisher CLI for the private package registry: validate, stage, verify and commit multi-ecosystem releases."
repository = "https://github.com/private-package-registry/ppr-tool"
publish = false

[lib]
name = "ppr_tool"
path = "src/lib.rs"

[[bin]]
name = "ppr-tool"
path = "src/main.rs"

[dependencies]
anstream = "1"
anstyle = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
glob = "0.3"
indicatif = "0.18"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.3"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "std", "serde"] }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
